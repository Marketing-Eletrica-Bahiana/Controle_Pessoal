<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle Pessoal | Elétrica Bahiana</title>
    <link rel="icon" type="image/png" href="marca/logos/Icone_Azul.png" />
    <link rel="apple-touch-icon" href="marca/logos/Icone_Azul.png" />
    <link rel="stylesheet" href="fontes/fontes.css" />
    <!-- Reserva: Lato do Google Fonts, carregada sem bloquear a página. Só é usada se a fonte local falhar. -->

      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="css/estilos.css" />

      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js",

          "chart.js": "https://cdn.jsdelivr.net/npm/chart.js@4.6.1/auto/+esm"
        }
      }
    </script>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js" />
  </head>
  <body>

      <div class="fundo-marca">

        </main>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
